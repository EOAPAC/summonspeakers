name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Vite 8 needs 20.19+/22.12+; package.json pins the floor.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --frozen-lockfile so a stale bun.lock fails the run rather than being
      # silently updated, which is the whole point of committing it.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # The roster module is ~180KB and server-only. If it ever reaches the
      # client bundle every visitor downloads it, and nothing else would catch
      # that — the build succeeds either way.
      - name: Assert the roster stays out of the client bundle
        run: |
          if grep -rlq "Aarathi Arumugam" .vercel/output/static/; then
            echo "::error::Roster data leaked into the client bundle."
            grep -rl "Aarathi Arumugam" .vercel/output/static/
            exit 1
          fi
          echo "Roster data absent from .vercel/output/static — ok"

      # A VITE_-prefixed variable is inlined into the client bundle, so reading
      # one is the same as publishing it. Checking the runner's environment would
      # be vacuous — it never holds the deployment's vars — so this checks what
      # the source actually reads, which is the realistic way a secret ends up
      # with the wrong prefix.
      #
      # The allowlist is deliberately short, and it is an allowlist rather than a
      # deny-list of scary-looking names so that any NEW prefixed variable fails
      # until someone decides it is genuinely publishable. The three permitted:
      #
      #   VITE_SITE_URL           — a public canonical URL.
      #   VITE_SUPABASE_URL       — a public project URL.
      #   VITE_SUPABASE_ANON_KEY  — public by design. It sits in every Supabase
      #                             client app on the internet and grants only
      #                             what row-level security allows; the
      #                             migration's policies are the enforcement.
      #
      # A service-role key, a Resend key, or a Runware key must never carry the
      # prefix. Those stay unprefixed and are read server-side.
      - name: Assert the source reads only the allowlisted VITE_ variables
        run: |
          ALLOWED='VITE_SITE_URL|VITE_SUPABASE_URL|VITE_SUPABASE_ANON_KEY'
          offenders=$(grep -rhoE 'VITE_[A-Z0-9_]+' src/ scripts/ \
            | sort -u | grep -vxE "$ALLOWED" || true)
          if [ -n "$offenders" ]; then
            echo "::error::A VITE_ variable outside the allowlist is read by the source."
            echo "$offenders"
            echo "That prefix publishes the value in the client bundle. If it is genuinely"
            echo "public, add it to ALLOWED in this step and say why. Otherwise drop the"
            echo "prefix and read it from a server function instead."
            exit 1
          fi
          echo "Source reads only allowlisted VITE_ variables — ok"

      # RLS is what makes publishing the anon key safe, so a table without it is
      # the difference between a public key and an open database.
      - name: Assert every migration table enables row level security
        run: |
          if [ ! -d supabase/migrations ]; then
            echo "No migrations — skipping"; exit 0
          fi
          tables=$(grep -rhoiE 'create table +(if not exists +)?[a-zA-Z0-9_."]+' supabase/migrations/ \
                   | awk '{print $NF}' | tr -d '"' | sed 's/^public\.//' | sort -u)
          if [ -z "$tables" ]; then
            echo "::error::Found migrations but parsed no CREATE TABLE — this check would pass vacuously."
            exit 1
          fi
          echo "tables: $(echo "$tables" | tr '\n' ' ')"
          missing=""
          for bare in $tables; do
            if ! grep -rqiE "alter table +(public\.)?\"?${bare}\"? +enable row level security" supabase/migrations/; then
              missing="$missing $bare"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Table(s) created without enabling row level security:$missing"
            echo "The anon key is published in the client bundle, so RLS is the only"
            echo "thing standing between it and the data."
            exit 1
          fi
          echo "All migration tables enable row level security — ok"

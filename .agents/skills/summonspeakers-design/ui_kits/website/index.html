<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SummonSpeakers UI Kit — Website</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .demo-tabs { display: flex; gap: 8px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 10; }
    .demo-tab { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-family: var(--font-body); font-weight: 500; }
    .demo-tab.active { background: var(--ink); color: var(--surface); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- Shared components ---
    function Button({ children, variant = "primary", href, onClick, loading, ariaLabel }) {
      const Tag = href ? "a" : "button";
      const className = {
        primary: "btn-primary",
        amber: "btn-amber",
        secondary: "btn-secondary",
        ghost: "btn-secondary"
      }[variant] || "btn-primary";
      return (
        <Tag className={className} href={href} onClick={onClick} aria-label={ariaLabel} aria-busy={loading} style={{ pointerEvents: loading ? "none" : undefined }}>
          {loading ? "Sending…" : children}
        </Tag>
      );
    }

    function FeeBand({ children, available }) {
      return (
        <span className="fee-band">
          {available && <span style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--cta-amber)", display: "inline-block" }} />}
          {children}
        </span>
      );
    }

    function Pill({ children, href }) {
      return href ? <a href={href} className="pill" style={{ textDecoration: "none" }}>{children}</a> : <span className="pill">{children}</span>;
    }

    function SpeakerCard({ speaker, href }) {
      return (
        <a href={href} className="card" style={{ textDecoration: "none", color: "inherit", display: "block" }}>
          <div className="media-well" style={{ borderRadius: 0, height: 220 }}>
            <img src={speaker.image || "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=600&auto=format&fit=crop&q=80"} alt={speaker.name} style={{ width: "100%", height: "100%", objectFit: "cover", filter: "grayscale(100%)" }} />
          </div>
          <div style={{ padding: 20 }}>
            <div style={{ fontWeight: 700, marginBottom: 4 }}>{speaker.name}</div>
            <div style={{ fontSize: 14, color: "var(--ink-2)", marginBottom: 12 }}>{speaker.topics?.slice(0, 2).join(" · ")}</div>
            <FeeBand available={speaker.available}>{speaker.fee}</FeeBand>
          </div>
        </a>
      );
    }

    function Header({ currentPath }) {
      const [open, setOpen] = useState(false);
      const links = [
        { label: "Speakers", href: "/speakers" },
        { label: "Topics", href: "/topics" },
        { label: "Fees", href: "/fees" },
        { label: "How it works", href: "/how-it-works" },
        { label: "For speakers", href: "/for-speakers" }
      ];
      return (
        <header style={{ borderBottom: "1px solid var(--line)" }}>
          <div className="container-x" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", height: 64 }}>
            <a href="/" style={{ textDecoration: "none", color: "inherit", fontWeight: 800, letterSpacing: "-0.04em", fontSize: 20 }}>SummonSpeakers</a>
            <nav style={{ display: "flex", gap: 24, alignItems: "center" }} className="desktop-nav">
              {links.map((l) => <a key={l.href} href={l.href} style={{ textDecoration: "none", color: currentPath === l.href ? "var(--ink)" : "var(--ink-2)", fontWeight: 500, fontSize: 14 }}>{l.label}</a>)}
              <Button href="/get-matched" variant="primary">Get matched</Button>
            </nav>
            <button className="mobile-toggle" onClick={() => setOpen(!open)} aria-label="Toggle menu" aria-expanded={open} style={{ background: "none", border: "none", fontSize: 24, cursor: "pointer" }}>☰</button>
          </div>
          {open && (
            <div style={{ borderTop: "1px solid var(--line)", padding: "16px var(--pad-inline)" }}>
              {links.map((l) => <a key={l.href} href={l.href} style={{ display: "block", padding: "12px 0", textDecoration: "none", color: "var(--ink-2)" }}>{l.label}</a>)}
              <Button href="/get-matched" variant="primary" style={{ marginTop: 12 }}>Get matched</Button>
            </div>
          )}
          <style>{`.mobile-toggle { display: none; } @media (max-width: 900px) { .desktop-nav { display: none !important; } .mobile-toggle { display: block; } }`}</style>
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="on-ink" style={{ paddingBlock: "var(--sec-pad)" }}>
          <div className="container-x" style={{ display: "grid", gap: 40, gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))" }}>
            <div>
              <div style={{ fontWeight: 800, letterSpacing: "-0.04em", marginBottom: 16 }}>SummonSpeakers</div>
              <p style={{ fontSize: 14, color: "var(--ink-3)", maxWidth: "32ch" }}>Matching event organisers with speakers who move audiences.</p>
            </div>
            <div>
              <div className="label-mono" style={{ marginBottom: 16, color: "var(--ink-3)" }}>Explore</div>
              <a href="/speakers" style={{ display: "block", color: "#fff", textDecoration: "none", marginBottom: 8, fontSize: 14 }}>Speakers</a>
              <a href="/topics" style={{ display: "block", color: "#fff", textDecoration: "none", marginBottom: 8, fontSize: 14 }}>Topics</a>
              <a href="/fees" style={{ display: "block", color: "#fff", textDecoration: "none", marginBottom: 8, fontSize: 14 }}>Fees</a>
            </div>
            <div>
              <div className="label-mono" style={{ marginBottom: 16, color: "var(--ink-3)" }}>Company</div>
              <a href="/how-it-works" style={{ display: "block", color: "#fff", textDecoration: "none", marginBottom: 8, fontSize: 14 }}>How it works</a>
              <a href="/for-speakers" style={{ display: "block", color: "#fff", textDecoration: "none", marginBottom: 8, fontSize: 14 }}>For speakers</a>
            </div>
            <div>
              <div className="label-mono" style={{ marginBottom: 16, color: "var(--ink-3)" }}>Legal</div>
              <a href="/privacy" style={{ display: "block", color: "#fff", textDecoration: "none", marginBottom: 8, fontSize: 14 }}>Privacy</a>
              <a href="/terms" style={{ display: "block", color: "#fff", textDecoration: "none", marginBottom: 8, fontSize: 14 }}>Terms</a>
            </div>
          </div>
        </footer>
      );
    }

    function Breadcrumbs({ items }) {
      return (
        <nav aria-label="Breadcrumb" style={{ marginBottom: 24 }}>
          <ol style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", gap: 8, fontSize: 14, color: "var(--ink-3)" }}>
            {items.map((item, i) => (
              <li key={item.href || item.label}>
                {i > 0 && <span style={{ marginRight: 8 }}>/</span>}
                {item.href ? <a href={item.href} style={{ color: "var(--ink-2)", textDecoration: "none" }}>{item.label}</a> : <span style={{ color: "var(--ink)" }}>{item.label}</span>}
              </li>
            ))}
          </ol>
        </nav>
      );
    }

    function ClosingCta({ title = "Get matched", body = "Tell us about your event. We’ll return a shortlist of speakers within 24 hours." }) {
      return (
        <section className="section-y-lg" style={{ background: "var(--surface-alt)" }}>
          <div className="container-x">
            <div style={{ maxWidth: 900 }}>
              <h2 className="display" style={{ fontSize: "var(--display-cta)", marginBottom: 24 }}>{title}</h2>
              <p className="measure-lead" style={{ fontSize: "clamp(18px, 2vw, 24px)", color: "var(--ink-2)", marginBottom: 32 }}>{body}</p>
              <Button href="/get-matched" variant="primary">Start your brief</Button>
            </div>
          </div>
        </section>
      );
    }

    function FAQ({ items }) {
      return (
        <div style={{ display: "grid", gap: 16 }}>
          {items.map((item) => (
            <details key={item.question} style={{ borderTop: "1px solid var(--line)", paddingTop: 16 }}>
              <summary style={{ fontWeight: 700, cursor: "pointer", listStyle: "none" }}>{item.question}</summary>
              <p style={{ color: "var(--ink-2)", marginTop: 12, maxWidth: "var(--measure-lead)" }}>{item.answer}</p>
            </details>
          ))}
        </div>
      );
    }

    // --- Pages ---
    function HomePage() {
      const featured = [
        { name: "Dr. Maya Ellison", topics: ["Leadership", "AI ethics"], fee: "$15k – $20k", available: true },
        { name: "Jonas Reeves", topics: ["Climate", "Policy"], fee: "$10k – $15k", available: false },
        { name: "Priya Nambiar", topics: ["Finance", "Behaviour"], fee: "$20k – $30k", available: true },
        { name: "Derek Holt", topics: ["Sport", "Performance"], fee: "$8k – $12k", available: true }
      ];
      const categories = ["Leadership", "Innovation", "Climate", "Finance", "Health", "Sport", "Culture", "Policy"];
      return (
        <div>
          <Header currentPath="/" />
          <section className="section-y-lg" style={{ borderBottom: "1px solid var(--line)" }}>
            <div className="container-x">
              <span className="label-mono" style={{ display: "block", marginBottom: 16 }}>Speaker marketplace</span>
              <h1 className="display" style={{ fontSize: "var(--display-hero)", maxWidth: "12ch", marginBottom: 24 }}>Find the speaker your audience needs</h1>
              <p className="measure-lead" style={{ fontSize: "clamp(18px, 2vw, 24px)", color: "var(--ink-2)", marginBottom: 32 }}>SummonSpeakers matches event organisers with keynote speakers, moderators, and panelists who can move an audience.</p>
              <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                <Button href="/get-matched" variant="primary">Get matched</Button>
                <Button href="/speakers" variant="secondary">View speakers</Button>
              </div>
            </div>
          </section>
          <section className="section-y">
            <div className="container-x">
              <h2 className="display" style={{ fontSize: "var(--display-sm)", marginBottom: 32 }}>Browse by topic</h2>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                {categories.map((c) => <Pill key={c} href={`/topics/${c.toLowerCase()}`}>{c}</Pill>)}
              </div>
            </div>
          </section>
          <section className="section-y" style={{ background: "var(--surface-alt)" }}>
            <div className="container-x">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 32, flexWrap: "wrap", gap: 16 }}>
                <h2 className="display" style={{ fontSize: "var(--display-sm)" }}>Featured speakers</h2>
                <Button href="/speakers" variant="secondary">View all</Button>
              </div>
              <div style={{ display: "grid", gap: 24, gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))" }}>
                {featured.map((s) => <SpeakerCard key={s.name} speaker={s} href={`/speakers/${s.name.toLowerCase().replace(/\s+/g, "-")}`} />)}
              </div>
            </div>
          </section>
          <ClosingCta />
          <Footer />
        </div>
      );
    }

    function CategoryPage() {
      const speakers = [
        { name: "Dr. Maya Ellison", topics: ["Leadership", "AI ethics"], fee: "$15k – $20k", available: true },
        { name: "Samira Touati", topics: ["Leadership", "Culture"], fee: "$12k – $18k", available: true },
        { name: "Liam Parker", topics: ["Leadership", "Sport"], fee: "$8k – $12k", available: false },
        { name: "Chen Wei", topics: ["Leadership", "Finance"], fee: "$20k – $30k", available: true },
        { name: "Ava Donovan", topics: ["Leadership", "Policy"], fee: "$10k – $15k", available: true },
        { name: "Noah Bertrand", topics: ["Leadership", "Innovation"], fee: "$15k – $25k", available: false }
      ];
      const faq = [
        { question: "How do you choose speakers for a topic?", answer: "We curate by verified topic expertise, audience feedback, and event format experience." },
        { question: "Can I request a speaker outside this category?", answer: "Yes. Brief us on your event and we’ll match across the full directory." }
      ];
      return (
        <div>
          <Header currentPath="/topics" />
          <section className="section-y-lg">
            <div className="container-x">
              <Breadcrumbs items={[{ label: "Home", href: "/" }, { label: "Topics", href: "/topics" }, { label: "Leadership" }]} />
              <span className="label-mono" style={{ display: "block", marginBottom: 16 }}>Topic</span>
              <h1 className="display" style={{ fontSize: "var(--display-lg)", marginBottom: 24 }}>Leadership</h1>
              <p className="measure-lead" style={{ fontSize: "clamp(18px, 2vw, 24px)", color: "var(--ink-2)" }}>Speakers who help organisations lead through change, build culture, and make better decisions under pressure.</p>
            </div>
          </section>
          <section className="section-y" style={{ borderTop: "1px solid var(--line)" }}>
            <div className="container-x">
              <div style={{ display: "grid", gap: 24, gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))" }}>
                {speakers.map((s) => <SpeakerCard key={s.name} speaker={s} href={`/speakers/${s.name.toLowerCase().replace(/\s+/g, "-")}`} />)}
              </div>
            </div>
          </section>
          <section className="section-y" style={{ background: "var(--surface-alt)" }}>
            <div className="container-x">
              <h2 className="display" style={{ fontSize: "var(--display-sm)", marginBottom: 32 }}>Common questions</h2>
              <FAQ items={faq} />
            </div>
          </section>
          <Footer />
        </div>
      );
    }

    function ProfilePage() {
      const speaker = {
        name: "Dr. Maya Ellison",
        tagline: "Leadership researcher. AI ethics adviser. Former chief of staff to two Fortune 50 CEOs.",
        fee: "$15k – $20k",
        available: true,
        topics: ["Leadership", "AI ethics", "Culture change", "Decision-making"],
        bio: "Dr. Maya Ellison studies how leaders make decisions under uncertainty. She advises boards and executive teams on responsible AI adoption, culture change, and governance. Her keynote, The Quiet Leader, has been delivered at over 120 events across Europe, North America, and Asia.",
        image: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=800&auto=format&fit=crop&q=80"
      };
      return (
        <div>
          <Header currentPath="/speakers" />
          <section className="section-y-lg">
            <div className="container-x">
              <Breadcrumbs items={[{ label: "Home", href: "/" }, { label: "Speakers", href: "/speakers" }, { label: speaker.name }]} />
              <div style={{ display: "grid", gap: 48, gridTemplateColumns: "1fr 1fr", alignItems: "center" }}>
                <div>
                  <span className="label-mono" style={{ display: "block", marginBottom: 16 }}>Speaker profile</span>
                  <h1 className="display" style={{ fontSize: "var(--display-lg)", marginBottom: 16 }}>{speaker.name}</h1>
                  <p className="measure-lead" style={{ color: "var(--ink-2)", marginBottom: 24 }}>{speaker.tagline}</p>
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 24 }}>
                    <FeeBand available={speaker.available}>{speaker.fee}</FeeBand>
                    {speaker.topics.map((t) => <Pill key={t}>{t}</Pill>)}
                  </div>
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                    <Button href="/get-matched?speaker=maya-ellison" variant="primary">Request Maya</Button>
                    <Button href="#bio" variant="secondary">Read bio</Button>
                  </div>
                </div>
                <div className="media-well" style={{ aspectRatio: "4/5" }}>
                  <img src={speaker.image} alt={speaker.name} style={{ width: "100%", height: "100%", objectFit: "cover", filter: "grayscale(100%)" }} />
                </div>
              </div>
            </div>
          </section>
          <section id="bio" className="section-y" style={{ borderTop: "1px solid var(--line)" }}>
            <div className="container-x">
              <div style={{ display: "grid", gap: 48, gridTemplateColumns: "1fr 1fr" }}>
                <div>
                  <h2 className="display" style={{ fontSize: "var(--display-sm)", marginBottom: 24 }}>About</h2>
                  <p style={{ color: "var(--ink-2)", maxWidth: "var(--measure-lead)", fontSize: 18, lineHeight: 1.6 }}>{speaker.bio}</p>
                </div>
                <div>
                  <h2 className="display" style={{ fontSize: "var(--display-sm)", marginBottom: 24 }}>Topics</h2>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {speaker.topics.map((t) => <Pill key={t} href={`/topics/${t.toLowerCase().replace(/\s+/g, "-")}`}>{t}</Pill>)}
                  </div>
                </div>
              </div>
            </div>
          </section>
          <Footer />
        </div>
      );
    }

    function EnquiryPage() {
      const [step, setStep] = useState(1);
      const [form, setForm] = useState({ eventName: "", date: "", audience: "", topic: "", name: "", email: "", organisation: "", budget: "", notes: "" });
      const [submitted, setSubmitted] = useState(false);
      function update(key, value) { setForm((f) => ({ ...f, [key]: value })); }
      function next(e) { e.preventDefault(); if (step < 3) setStep(step + 1); else setSubmitted(true); }

      if (submitted) return (
        <div>
          <Header currentPath="/get-matched" />
          <section className="section-y-lg">
            <div className="container-x" style={{ maxWidth: 600 }}>
              <h1 className="display" style={{ fontSize: "var(--display-md)", marginBottom: 24 }}>Brief received</h1>
              <p style={{ color: "var(--ink-2)", fontSize: 18, marginBottom: 32 }}>We’ll review your event and return a shortlist of speakers within 24 hours.</p>
              <Button href="/" variant="primary">Back to home</Button>
            </div>
          </section>
          <Footer />
        </div>
      );

      return (
        <div>
          <Header currentPath="/get-matched" />
          <section className="section-y-lg">
            <div className="container-x" style={{ maxWidth: 720 }}>
              <span className="label-mono" style={{ display: "block", marginBottom: 16 }}>Step {step} of 3</span>
              <h1 className="display" style={{ fontSize: "var(--display-md)", marginBottom: 32 }}>
                {step === 1 && "Tell us about your event"}
                {step === 2 && "Your contact details"}
                {step === 3 && "Final details"}
              </h1>
              <form onSubmit={next} style={{ display: "grid", gap: 24 }}>
                {step === 1 && (
                  <>
                    <label style={{ display: "grid", gap: 8 }}><span className="label-mono">Event name</span><input type="text" required value={form.eventName} onChange={(e) => update("eventName", e.target.value)} style={{ minHeight: 44, padding: "0 12px", border: "1px solid var(--line-2)", borderRadius: "var(--radius-sm)", fontFamily: "var(--font-body)" }} /></label>
                    <label style={{ display: "grid", gap: 8 }}><span className="label-mono">Event date</span><input type="date" required value={form.date} onChange={(e) => update("date", e.target.value)} style={{ minHeight: 44, padding: "0 12px", border: "1px solid var(--line-2)", borderRadius: "var(--radius-sm)", fontFamily: "var(--font-body)" }} /></label>
                    <label style={{ display: "grid", gap: 8 }}><span className="label-mono">Audience size</span><select required value={form.audience} onChange={(e) => update("audience", e.target.value)} style={{ minHeight: 44, padding: "0 12px", border: "1px solid var(--line-2)", borderRadius: "var(--radius-sm)", fontFamily: "var(--font-body)" }}><option value="">Select…</option><option value="50-100">50 – 100</option><option value="100-500">100 – 500</option><option value="500-1000">500 – 1000</option><option value="1000+">1000+</option></select></label>
                    <label style={{ display: "grid", gap: 8 }}><span className="label-mono">Topic or theme</span><input type="text" value={form.topic} onChange={(e) => update("topic", e.target.value)} style={{ minHeight: 44, padding: "0 12px", border: "1px solid var(--line-2)", borderRadius: "var(--radius-sm)", fontFamily: "var(--font-body)" }} /></label>
                  </>
                )}
                {step === 2 && (
                  <>
                    <label style={{ display: "grid", gap: 8 }}><span className="label-mono">Full name</span><input type="text" required value={form.name} onChange={(e) => update("name", e.target.value)} style={{ minHeight: 44, padding: "0 12px", border: "1px solid var(--line-2)", borderRadius: "var(--radius-sm)", fontFamily: "var(--font-body)" }} /></label>
                    <label style={{ display: "grid", gap: 8 }}><span className="label-mono">Work email</span><input type="email" required value={form.email} onChange={(e) => update("email", e.target.value)} style={{ minHeight: 44, padding: "0 12px", border: "1px solid var(--line-2)", borderRadius: "var(--radius-sm)", fontFamily: "var(--font-body)" }} /></label>
                    <label style={{ display: "grid", gap: 8 }}><span className="label-mono">Organisation</span><input type="text" required value={form.organisation} onChange={(e) => update("organisation", e.target.value)} style={{ minHeight: 44, padding: "0 12px", border: "1px solid var(--line-2)", borderRadius: "var(--radius-sm)", fontFamily: "var(--font-body)" }} /></label>
                  </>
                )}
                {step === 3 && (
                  <>
                    <label style={{ display: "grid", gap: 8 }}><span className="label-mono">Fee budget</span><select value={form.budget} onChange={(e) => update("budget", e.target.value)} style={{ minHeight: 44, padding: "0 12px", border: "1px solid var(--line-2)", borderRadius: "var(--radius-sm)", fontFamily: "var(--font-body)" }}><option value="">Select…</option><option value="under-10k">Under $10k</option><option value="10k-20k">$10k – $20k</option><option value="20k-50k">$20k – $50k</option><option value="over-50k">Over $50k</option><option value="open">Fee on application</option></select></label>
                    <label style={{ display: "grid", gap: 8 }}><span className="label-mono">Anything else?</span><textarea value={form.notes} onChange={(e) => update("notes", e.target.value)} rows={5} style={{ padding: 12, border: "1px solid var(--line-2)", borderRadius: "var(--radius-sm)", fontFamily: "var(--font-body)" }} /></label>
                  </>
                )}
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 16 }}>
                  {step > 1 ? <button type="button" onClick={() => setStep(step - 1)} className="btn-secondary">Back</button> : <span />}
                  <Button variant="primary">{step === 3 ? "Send brief" : "Continue"}</Button>
                </div>
              </form>
            </div>
          </section>
          <Footer />
        </div>
      );
    }

    // --- App ---
    function App() {
      const [page, setPage] = useState("home");
      const tabs = [
        { id: "home", label: "Home" },
        { id: "category", label: "Category" },
        { id: "profile", label: "Profile" },
        { id: "enquiry", label: "Enquiry" }
      ];
      const pages = { home: HomePage, category: CategoryPage, profile: ProfilePage, enquiry: EnquiryPage };
      const PageComponent = pages[page];
      return (
        <div>
          <div className="demo-tabs">
            {tabs.map((t) => <button key={t.id} className={`demo-tab ${page === t.id ? "active" : ""}`} onClick={() => setPage(t.id)}>{t.label}</button>)}
          </div>
          <PageComponent />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
